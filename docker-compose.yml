version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: networking_app_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: networking_app_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app_network

volumes:
  sqlite_data:
    driver: local

networks:
  app_network:
    driver: bridge
